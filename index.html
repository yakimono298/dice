<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ヒントサイコロ</title>
<style>
    body {
        font-family: sans-serif;
        text-align: center;
        background: #f5f5f5;
        margin-top: 80px;
    }

    h1 {
        color: #333;
    }

    button {
        font-size: 24px;
        padding: 15px 40px;
        cursor: pointer;
        border: none;
        border-radius: 10px;
        background: #4CAF50;
        color: white;
    }

    button:hover {
        background: #45a049;
    }

    #result {
        margin-top: 40px;
        font-size: 28px;
        font-weight: bold;
        white-space: pre-wrap;
    }

    .hint {
        color: #d35400;
    }

    .miss {
        color: #555;
    }
</style>
</head>
<body>

<h1>🎲 サイコロを振る</h1>

<button onclick="rollDice()">サイコロを振る！</button>

<div id="result"></div>

<script>
function rollDice() {
    const dice = Math.floor(Math.random() * 6) + 1;
    const result = document.getElementById("result");

    if (dice === 1) {
        result.className = "hint";
        result.innerHTML =
            `🎉 出目：${dice}<br><br>` +
            `ヒント：ポスターは、ただの飾りではない。そこにも事件の手掛かりが隠されている。`;
    } else {
        result.className = "miss";
        result.innerHTML =
            `🎲 出目：${dice}<br><br>残念`;
    }
}
</script>

</body>
</html>
