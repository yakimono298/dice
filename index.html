<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>サイコロ</title>
  <style>
    body { font-family: sans-serif; padding: 20px; 
           text-align: center;}
    button { padding: 10px 16px; cursor: pointer; }

    #result{
    margin-top:20px;
    font-size:24px;
    font-weight:bold;
　　}

　　#diceText{
    margin-top:15px;
    font-size:22px;
　　}

　　button{
    font-size:20px;
    padding:12px 30px;
　　}
    
    #diceWrap {
      margin-top: 14px auto 0;
      width: 140px; 
      height: 140px;
      display: grid;
      place-items: center;
      border: 1px dashed #ccc;
      border-radius: 10px;
    }

    #diceImg {
      width: 120px;
      height: 120px;
      object-fit: contain;
      transform-origin: center;
    }

    /* 🎞️ 振っている間のアニメーション */
    .shaking #diceImg {
      animation: shake 0.12s infinite linear;
      filter: saturate(1.2);
    }

    @keyframes shake {
      0%   { transform: rotate(0deg)   translateX(0px) translateY(0px) scale(1); }
      25%  { transform: rotate(12deg)  translateX(3px) translateY(-2px) scale(1.02); }
      50%  { transform: rotate(-10deg) translateX(-3px) translateY(2px) scale(0.99); }
      75%  { transform: rotate(8deg)   translateX(2px) translateY(-1px) scale(1.01); }
      100% { transform: rotate(0deg)   translateX(0px) translateY(0px) scale(1); }
    }

    /* ボタン押下中は無効化して事故防止 */
    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }
  </style>
</head>
<body>
  <h1>サイコロを振って１を出そう🎲</h1>

  <button id="rollBtn">サイコロを振る</button>

  <div id="diceWrap" class="idle">
    <img id="diceImg" src="images/dice-1.png" alt="サイコロの目" />
  </div>

  <div id="diceText">出目：—</div>
  <div id="result">ここに結果が出ます</div>

  <script>
    const rollBtn = document.getElementById("rollBtn");
    const diceImg = document.getElementById("diceImg");
    const diceText = document.getElementById("diceText");
    const result = document.getElementById("result");
    const diceWrap = document.getElementById("diceWrap");

    // 画像パス（必要ならここだけ変更）
    const imgPath = (n) => `images/dice-${n}.png`;

    function setDice(n) {
      diceImg.src = imgPath(n);
      diceText.textContent = `出目：${n}`;
    }

    rollBtn.addEventListener("click", () => {
      // 押している間は連打しない
      rollBtn.disabled = true;

      // 🎞️ アニメーション開始
      diceWrap.classList.add("shaking");
      result.textContent = "振っています…";

      // まずランダムに見せる（チラチラ切替）
      // 最終的に "dice"（当たり）へ確定させる
      const finalDice = Math.floor(Math.random() * 6) + 1;

      let ticks = 0;
      const interval = setInterval(() => {
        const temp = Math.floor(Math.random() * 6) + 1;
        setDice(temp);
        ticks++;

        // 振る時間（例：0.9秒）
        if (ticks >= 8) {
          clearInterval(interval);

          // 🎯 確定
          setDice(finalDice);

          if (finalDice === 1) {
            result.textContent =
              "ヒント：ポスターは、ただの飾りではない。そこにも事件の手掛かりが隠されている。";
          } else {
            result.textContent = "残念";
          }

          // 🎞️ アニメーション停止
          diceWrap.classList.remove("shaking");
          rollBtn.disabled = false;
        }
      }, 110);
    });
  </script>
</body>
</html>
